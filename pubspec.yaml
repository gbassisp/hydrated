name: rehydrated
description:
  An automatically persisted BehaviorSubject with simple hydration for Flutter.
  A fork of the original hydrated lib.
version: 2.1.1
homepage: https://github.com/gbassisp/hydrated

environment:
  sdk: '>=2.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  rxdart: ^0.28.0
  shared_preferences: ^2.0.1

dev_dependencies:
  dart_code_metrics: ^5.7.6
  equatable:
  flutter_test:
    sdk: flutter
  lints: ^6.1.0
  very_good_analysis: ^11.0.0
